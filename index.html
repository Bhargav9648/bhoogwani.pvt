<!doctype html>
<html lang="gu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bhoogwani · ભૂગવાણી</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Noto+Sans+Gujarati:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f0e1;--card:#fffdf8;--brown:#4a2f1b;--onbrown:#fbf4e6;--green:#3f7a3a;--greenbg:#e3eed6;--ink:#3a2616;--mute:#7b6a57;--line:#e6dbc3;--warn:#fff2cc;--warnink:#6b4e00;--red:#b3392b;--shadow:0 6px 22px rgba(74,47,27,.10);
box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1711;--card:#2a2319;--brown:#3b2616;--green:#8fc26d;--greenbg:#2b3a22;--ink:#f1e8d6;--mute:#b3a48c;--line:#3e3425;--warn:#3d3210;--warnink:#f0d98a;--red:#ef8a7c;--shadow:0 6px 22px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg:#1c1711;--card:#2a2319;--brown:#3b2616;--green:#8fc26d;--greenbg:#2b3a22;--ink:#f1e8d6;--mute:#b3a48c;--line:#3e3425;--warn:#3d3210;--warnink:#f0d98a;--red:#ef8a7c;--shadow:0 6px 22px rgba(0,0,0,.35)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.75 'Noto Sans Gujarati',system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--brown);z-index:40}
h1,h2,h3{font-family:'Fraunces','Noto Sans Gujarati',serif;margin:0;line-height:1.3;color:var(--brown)}
@media (prefers-color-scheme:dark){h1,h2,h3{color:var(--ink)}}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
.page{padding:44px 0 24px;min-height:60vh}
.page>.wrap>h2{font-size:32px;margin-bottom:8px}
.lead{color:var(--mute);margin:0 0 28px;max-width:62ch}
/* header */
header{background:var(--brown);color:var(--onbrown);padding:12px 0 6px}
.hrow{display:flex;flex-direction:column-reverse;gap:6px}
.hrow .lang{align-self:flex-end}
.brand{display:flex;align-items:center;justify-content:center;gap:16px;padding:6px 0 10px;color:var(--onbrown);text-decoration:none;align-self:center}
.brand h1{font-size:clamp(30px,8.5vw,48px);color:var(--onbrown);letter-spacing:.5px}
.sub{font-size:14px;opacity:.85}
/* LOGO PLACEHOLDER: put <img src="YOUR_LOGO_URL" alt="Bhoogwani"> inside .logo-box */
.logo-box{width:72px;height:72px;flex:0 0 auto;border-radius:16px;background:var(--onbrown);display:grid;place-items:center;overflow:hidden;font-size:38px}
.logo-box img{width:100%;height:100%;object-fit:cover}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--brown);display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:0 12px;box-shadow:var(--shadow)}
@media(min-width:760px){nav{justify-content:center}}
nav a{color:var(--onbrown);text-decoration:none;padding:12px 16px;white-space:nowrap;font-weight:600;font-size:15px;border-bottom:3px solid transparent;opacity:.85}
nav a.on{border-color:#a9d58a;opacity:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:12px 22px;border:0;border-radius:12px;font:inherit;font-weight:700;cursor:pointer;background:var(--green);color:#fff;text-decoration:none}
@media (prefers-color-scheme:dark){.btn:not(.alt):not(.red):not(.lang){color:#14210e}}
.btn.alt{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.red{background:var(--red);color:#fff}
.btn.sm{min-height:44px;padding:8px 14px;font-size:15px}
.btn.block{width:100%}
.lang{background:var(--onbrown);color:var(--brown);min-height:42px;padding:6px 14px;font-size:14px;white-space:nowrap}
:focus-visible{outline:3px solid var(--green);outline-offset:2px}
/* content */
.hero{margin-top:8px}
.hero h1{font-size:clamp(30px,5vw,44px);max-width:18ch}
.hero p{max-width:58ch;color:var(--mute);font-size:18px;margin:18px 0 28px}
.disc{background:var(--warn);color:var(--warnink);border-left:6px solid var(--green);padding:14px 18px;margin:0 0 28px;border-radius:10px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:44px;margin:20px 0 44px}
.card,.panel,.pill{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.card{overflow:hidden;display:flex;flex-direction:column}
.card img{width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--greenbg)}
.pad{padding:28px;display:flex;flex-direction:column;gap:18px;flex:1}
.price{font-size:24px;font-weight:700;color:var(--green)}
.badge{display:inline-block;padding:2px 12px;border-radius:99px;font-size:14px;font-weight:700;background:var(--greenbg);color:var(--green);margin-left:6px}
.badge.out{background:#f6d9d4;color:#8a2a1e}
.ing{font-size:15px;color:var(--mute)}
.avail{font-size:16px;color:var(--ink)}
.avail b{color:var(--green)}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>*{flex:1}
.pillars{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:24px;margin:32px 0}
.pill{padding:24px}.pill .ic{font-size:34px}
.story p{max-width:68ch;margin:0 0 16px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:28px;align-items:start}
.panel{padding:26px;display:flex;flex-direction:column;gap:12px}
.stars{display:flex;gap:6px}
.stars button{background:none;border:0;font-size:36px;cursor:pointer;color:var(--line);padding:0 2px;min-width:44px;min-height:44px}
.stars button.on{color:#e0a416}
/* cart */
.item{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:14px 0;border-bottom:1px solid var(--line)}
.item .nm{flex:1 1 200px;font-weight:700}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-size:22px;font-weight:700;cursor:pointer}
.qty b{min-width:28px;text-align:center}
.tot{font-size:24px;font-weight:700;display:flex;justify-content:space-between;padding-top:14px}
footer{background:var(--brown);color:var(--onbrown);margin-top:48px;padding:28px 0;text-align:center;font-size:15px}
footer button{background:none;border:0;color:inherit;font:inherit;cursor:pointer;opacity:.75;padding:8px 12px;font-size:13px;text-decoration:underline}
/* modal / forms */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:50}
#modal.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:26px 22px calc(28px + env(safe-area-inset-bottom,0px))}
@media(min-width:600px){#modal{align-items:center}.sheet{border-radius:22px}}
label{display:block;font-weight:700;margin:14px 0 4px;font-size:15px}
input,select,textarea{width:100%;min-height:50px;padding:10px 12px;font:inherit;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
textarea{min-height:92px}
/* admin */
.tabs{display:flex;gap:10px;margin:8px 0 16px}
.tabs .btn{flex:1;flex-direction:column;min-height:64px;gap:0;font-size:15px}
.tabs .btn:not(.on){background:var(--card);color:var(--ink);border:2px solid var(--line)}
.sum{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px}
.sum div{border-radius:14px;padding:16px;text-align:center;font-weight:700;background:var(--warn);color:var(--warnink)}
.sum div.d{background:var(--greenbg);color:var(--green)}
.sum div.f{background:#f6d9d4;color:#8a2a1e}
.order.fail{border-left-color:var(--red);opacity:.85}
.sum b{display:block;font-size:34px;line-height:1.1}
.order{background:var(--card);border:1px solid var(--line);border-left:8px solid #d8a021;border-radius:12px;padding:16px;margin-bottom:14px;display:flex;flex-direction:column;gap:6px}
.order.done{border-left-color:var(--green);opacity:.8}
.order .nm{font-size:20px;font-weight:700}
.order a.tel{font-size:20px;font-weight:700;color:var(--green)}
.big{font-size:56px;text-align:center}
.pin{text-align:center;font-size:28px;letter-spacing:10px}
.empty{padding:30px;text-align:center;color:var(--mute)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 22px;border-radius:99px;z-index:60;font-weight:700;max-width:90vw;text-align:center}
</style>
</head>
<body>
<!-- ============ HEADER: title + logo placeholder, then nav below ============ -->
<header><div class="wrap">
  <div class="hrow">
    <a class="brand" href="#home">
      <div class="logo-box" id="logoBox">🌿</div>
      <div><h1>Bhoogwani · ભૂગવાણી</h1><div class="sub" id="hsub"></div></div>
    </a>
    <button class="btn lang" onclick="toggleLang()">ગુજરાતી / English</button>
  </div>
  </div></header>
<nav id="nav"></nav>
<main id="app"></main>
<footer><div class="wrap">© Bhoogwani · ભૂગવાણી<br><button id="adminLink" onclick="askPin()"></button><br><span style="opacity:.85">bhoogwani.pvt.ltd</span></div></footer>
<div id="modal" onclick="if(event.target===this)closeModal()"><div class="sheet" id="sheet"></div></div>

<script>
/* ================= CONFIGURATION ================= */
const WHATSAPP_NUMBER = "918238158243";   // primary WhatsApp order number
const CALLING_NUMBER  = "9624926441";     // direct phone / call contact
const ADMIN_PIN = "0230";                 // 4-digit admin PIN
const EMAIL = "bhoogwanipvt@gmail.com";
const YOUTUBE_CHANNEL = "https://www.youtube.com/channel/UC3-M_2h90w5X0n7cxdsekOg"; // channel: gujarat bandhu ffg
const LOGO_URL = "";   // optional logo image URL (or upload it in Admin → Settings)
/* ▼▼ PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL BETWEEN THE QUOTES ▼▼
   Orders (type:"order") and feedback (type:"feedback") are POSTed here as JSON. Blank = no sheet logging. */
const GOOGLE_SHEET_URL = "https://script.google.com/macros/s/AKfycbxVmfihyj9R09_hxMe4P1T0Zm8j96sro66wBMCPRKy6lICcnuo3lCefMcmQdCp5xFgt/exec";

/* ================= HELPERS ================= */
let lang="gu";
const x=(e,g)=>lang==="gu"?g:e;                       // x("English","ગુજરાતી")
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const mem={};
/* STORAGE LAYER: LocalStorage with memory fallback. Swap load()/save() for Firebase later. */
function load(k,fb){try{const v=localStorage.getItem(k);if(v)return JSON.parse(v);}catch(e){if(mem[k])return mem[k];}return fb;}
function save(k,v){mem[k]=v;try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function logToSheet(p){ // background POST (no-cors: Apps Script sends no CORS headers)
  if(!GOOGLE_SHEET_URL)return;
  try{fetch(GOOGLE_SHEET_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(p)}).catch(()=>{});}catch(e){}
}
function toast(m){const d=document.createElement("div");d.className="toast";d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),3200);}
function normPhone(s){ // accepts Gujarati digits, spaces, +91/91/0 prefix -> 10 digits
  let d=String(s||"").replace(/[\u0AE6-\u0AEF]/g,c=>c.charCodeAt(0)-0x0AE6).replace(/\D/g,"");
  if(d.length===12&&d.startsWith("91"))d=d.slice(2);else if(d.length===11&&d.startsWith("0"))d=d.slice(1);
  return d;
}

/* ================= DATA ================= */
const ph=(e,c)=>"data:image/svg+xml;utf8,"+encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 300'><rect width='400' height='300' fill='${c}'/><text x='200' y='185' font-size='110' text-anchor='middle'>${e}</text></svg>`);
const DEFAULTS=[
 {id:"p1",en:"Bhoogwani Sugar Control Ayurvedic Supportive Powder",gu:"ભૂગવાણી મધુપ્રમેહ ચૂર્ણ / ઔષધિ (સુગર નિયંત્રણ માટે સહાયક પાવડર)",price:499,stock:50,
  descEn:"Powerful combination of 10-12 Ayurvedic herbs including Varahi Kand, Methi, Aloe Vera, Karela, Jamun Seed, Gudmar, Amla, Haldi, Tulsi, Daruharidra, and other Ayurvedic supportive herbs.",
  descGu:"૧૦-૧૨ શ્રેષ્ઠ આયુર્વેદિક જડીબુટ્ટીઓનું મિશ્રણ — વરાહી કંદ, મેથી, એલોવેરા, કારેલા, જામુન બીજ, ગુડમાર, આમળા, હળદર, તુલસી, દારુહરિદ્રા અને અન્ય વિશિષ્ટ આયુર્વેદિક જડીબુટ્ટીઓ.",img:ph("🌿","#dfe9cf"),video:""},
 {id:"p2",en:"Bhoogwani Digestive Care Churna (sample)",gu:"ભૂગવાણી પાચન ચૂર્ણ (નમૂનો)",price:299,stock:30,descEn:"Sample: Ajwain, Saunf, Harde and Jeera blend for digestive comfort.",descGu:"નમૂનો: અજમો, વરિયાળી, હરડે અને જીરુંનું મિશ્રણ — પાચન માટે સહાયક.",img:ph("🌾","#f0e4c8"),video:""},
 {id:"p3",en:"Bhoogwani Immunity Tulsi Drops (sample)",gu:"ભૂગવાણી તુલસી રોગપ્રતિકારક ટીપાં (નમૂનો)",price:349,stock:20,descEn:"Sample: Tulsi, Giloy and Ashwagandha extract for everyday wellness.",descGu:"નમૂનો: તુલસી, ગળો અને અશ્વગંધાનો અર્ક — રોજિંદા સ્વાસ્થ્ય માટે.",img:ph("🍃","#d6e6d0"),video:""}
];
const ABOUT_DEFAULT={
 en:"Bhoogwani began with a simple belief: Ayurveda works best when it is guided by a doctor who listens. Our mission is to offer authentic, doctor-guided Ayurvedic supportive formulations that families can trust, made from pure herbs and without harsh chemicals.\nWe put the patient first: we explain what each herb is for, how to use it, and when to speak to your doctor. Our products support natural wellness alongside, never instead of, proper medical advice.",
 gu:"ભૂગવાણીની શરૂઆત એક સરળ વિશ્વાસથી થઈ: આયુર્વેદ ત્યારે સૌથી સારું કામ કરે છે જ્યારે તેને સાંભળનાર ડૉક્ટરનું માર્ગદર્શન મળે. અમારું ધ્યેય શુદ્ધ જડીબુટ્ટીઓમાંથી, કઠોર રસાયણો વગર બનેલી, પરિવારો વિશ્વાસ કરી શકે તેવી પ્રામાણિક, ડૉક્ટર-માર્ગદર્શિત આયુર્વેદિક સહાયક ઔષધિઓ આપવાનું છે.\nઅમે દર્દીને પહેલા રાખીએ છીએ: દરેક ઔષધિ શેના માટે છે, કેવી રીતે વાપરવી અને ક્યારે ડૉક્ટરને મળવું તે સમજાવીએ છીએ. અમારી પ્રોડક્ટ્સ યોગ્ય તબીબી સલાહની સાથે કુદરતી સ્વાસ્થ્યને ટેકો આપે છે, તેના વિકલ્પ તરીકે નહીં."};
let products=load("bw3_products",DEFAULTS).map(p=>p.video===YOUTUBE_CHANNEL?{...p,video:""}:p), orders=load("bw3_orders",[]), cart=load("bw3_cart",{}), about=load("bw3_about",ABOUT_DEFAULT);
let page="home", tab="orders", isAdmin=false, rating=0, fb={}, co={pay:"cod"}, reopen=()=>{};
const pname=p=>lang==="gu"?(p.gu||p.en):(p.en||p.gu), pdesc=p=>lang==="gu"?(p.descGu||p.descEn):(p.descEn||p.descGu);
const persist=()=>{save("bw3_products",products);save("bw3_orders",orders);save("bw3_cart",cart);save("bw3_about",about);};
const cartCount=()=>Object.values(cart).reduce((a,b)=>a+b,0);

/* ================= ROUTER (hash based: #home #products #cart #about #contact #admin) ================= */
const ROUTES=["home","products","cart","about","contact","admin"];
function route(){
  let r=location.hash.slice(1); if(!ROUTES.includes(r))r="home";
  page=r; render(); window.scrollTo(0,0);
  if(r==="admin"&&!isAdmin)askPin();
}
window.addEventListener("hashchange",route);
function toggleLang(){keepForms();lang=lang==="gu"?"en":"gu";render();if($("modal").classList.contains("on"))reopen();}
function render(){
  document.documentElement.lang=lang;
  $("hsub").textContent=x("Doctor-guided Ayurvedic Supportive Care","ડૉક્ટર-માર્ગદર્શિત આયુર્વેદિક સહાયક સંભાળ");
  const lg=load("bw3_logo",LOGO_URL);$("logoBox").innerHTML=lg?`<img src="${esc(lg)}" alt="Bhoogwani">`:"🌿";
  $("adminLink").textContent=x("Admin login","માલિક લોગિન");
  const nv=[["home","Home","હોમ"],["products","Products","પ્રોડક્ટ્સ"],["cart","Cart & Order","કાર્ટ અને ઓર્ડર"],["about","About Us","અમારા વિશે"],["contact","Contact & Feedback","સંપર્ક અને પ્રતિસાદ"]];
  $("nav").innerHTML=nv.map(n=>`<a href="#${n[0]}" class="${page===n[0]?"on":""}">${x(n[1],n[2])}${n[0]==="cart"&&cartCount()?` (${cartCount()})`:""}</a>`).join("");
  const v={home:homeHTML,products:productsHTML,cart:cartHTML,about:aboutHTML,contact:contactHTML,admin:()=>isAdmin?adminHTML():`<div class="page"></div>`}[page];
  $("app").innerHTML=v(); if(page==="contact")paintStars();
}
const DISC=`<div class="disc">⚠️ દરેક ઔષધિ જુદી જુદી લાક્ષણિકતા ધરાવતી હોય, ડૉક્ટરની સલાહ પ્રમાણે ઉપયોગ કરવો.<br>Every herb has unique properties; please use as per Doctor’s advice.</div>`;

/* ================= PAGES ================= */
function homeHTML(){return `<div class="page"><div class="wrap"><div class="hero">

/* ================= CART & ORDER ================= */
function addCart(id){const p=products.find(v=>v.id===id);if(!p||p.stock<1)return;
  if((cart[id]||0)>=p.stock){toast(x("Maximum stock reached","વધુ સ્ટોક ઉપલબ્ધ નથી"));return;}
  cart[id]=(cart[id]||0)+1;persist();render();toast("🛒 "+x("Added to cart","કાર્ટમાં ઉમેર્યું")+" ("+cartCount()+")");}
function chgQty(id,d){keepForms();const p=products.find(v=>v.id===id);const q=(cart[id]||0)+d;
  if(q<=0)delete cart[id];else if(q<=p.stock)cart[id]=q;else toast(x("Maximum stock reached","વધુ સ્ટોક ઉપલબ્ધ નથી"));persist();render();}
function cartLines(){return Object.keys(cart).map(id=>{const p=products.find(v=>v.id===id);return p?{p,qty:cart[id]}:null;}).filter(Boolean);}
function cartHTML(){
  const L=cartLines(),total=L.reduce((a,l)=>a+l.p.price*l.qty,0);
  if(!L.length)return `<div class="page"><div class="wrap"><h2>${x("Cart & Order","કાર્ટ અને ઓર્ડર")}</h2><div class="empty">🛒<br>${x("Your cart is empty.","તમારું કાર્ટ ખાલી છે.")}</div><a class="btn" href="#products">${x("Browse products","પ્રોડક્ટ્સ જુઓ")}</a></div></div>`;
  return `<div class="page"><div class="wrap"><h2>${x("Cart & Order","કાર્ટ અને ઓર્ડર")}</h2><div class="two" style="margin-top:20px">
  <div class="panel">${L.map(l=>`<div class="item"><div class="nm">${esc(pname(l.p))}<br><span class="ing">₹${l.p.price}</span></div>
   <div class="qty"><button onclick="chgQty('${l.p.id}',-1)" aria-label="-">−</button><b>${l.qty}</b><button onclick="chgQty('${l.p.id}',1)" aria-label="+">+</button></div>
   <b>₹${l.p.price*l.qty}</b></div>`).join("")}<div class="tot"><span>${x("Total","કુલ રકમ")}</span><span>₹${total}</span></div></div>
  <div class="panel"><h3>${x("Delivery details","ડિલિવરી વિગતો")}</h3>
   <label>${x("Your name","તમારું નામ")}</label><input id="c_name" value="${esc(co.name||"")}" autocomplete="name">
   <label>${x("Phone number (10 digits)","ફોન નંબર (૧૦ અંક)")}</label><input id="c_phone" type="tel" inputmode="numeric" maxlength="18" value="${esc(co.phone||"")}" autocomplete="tel">
   <label>${x("Full delivery address (with area / landmark)","ઘરનું પૂરું સરનામું (વિસ્તાર / નિશાની સાથે)")}</label><textarea id="c_addr">${esc(co.addr||"")}</textarea>
   <label>${x("Payment mode","ચુકવણીની રીત")}</label><select id="c_pay"><option value="cod" ${co.pay==="cod"?"selected":""}>${x("Cash on Delivery","ઘરે રોકડા (COD)")}</option><option value="upi" ${co.pay==="upi"?"selected":""}>UPI</option></select>
   <button class="btn block" style="margin-top:10px" onclick="placeOrder()">✅ ${x("Confirm Order","ઓર્ડર પાકો કરો")}</button></div></div></div></div>`;
}
function waLink(o){
  const items=o.items.map(i=>`• ${i.en} × ${i.qty} = ₹${i.price*i.qty}`).join("\n");
  const msg=`🌿 Bhoogwani Order\nOrder No: ${o.id}\n${items}\nTotal: ₹${o.total}\nPayment: ${o.pay==="cod"?"Cash on Delivery":"UPI"}\nName: ${o.name}\nPhone: ${o.phone}\nAddress: ${o.address}`;
  return "https://wa.me/"+WHATSAPP_NUMBER+"?text="+encodeURIComponent(msg);
}
function placeOrder(){
  keepForms();
  const L=cartLines(),ph10=normPhone(co.phone);
  if(!co.name.trim()||!/^\d{10}$/.test(ph10)||co.addr.trim().length<5){toast(x("Please fill name, 10-digit phone and address.","કૃપા કરી નામ, ૧૦ અંકનો ફોન અને સરનામું ભરો."));return;}
  if(L.some(l=>l.qty>l.p.stock)){toast(x("Stock changed, please check quantities.","સ્ટોક બદલાયો છે, જથ્થો તપાસો."));return;}
  const items=L.map(l=>({pid:l.p.id,en:l.p.en,gu:l.p.gu,qty:l.qty,price:l.p.price}));
  const seq=load("bw3_seq",0)+1;save("bw3_seq",seq); // sequential order number 1, 2, 3...
  const o={id:String(seq),ts:new Date().toISOString(),name:co.name.trim(),phone:ph10,address:co.addr.trim(),items,
    total:items.reduce((a,i)=>a+i.price*i.qty,0),pay:co.pay,status:"pending"};
  // background POST to Google Sheet
  logToSheet({type:"order",id:o.id,ts:o.ts,name:o.name,phone:o.phone,address:o.address,product:items.map(i=>i.en+" x"+i.qty).join(", "),qty:items.reduce((a,i)=>a+i.qty,0),total:o.total,pay:o.pay,items});
  L.forEach(l=>l.p.stock-=l.qty);orders.unshift(o);cart={};co={pay:"cod"};persist();render();
  window.open(waLink(o),"_blank"); // WhatsApp opens with the full order pre-filled
  showModal(`<div class="big">✅</div><h2 style="text-align:center">${x("Order received!","ઓર્ડર મળી ગયો!")}</h2>
  <p style="text-align:center">${x("Order ID","ઓર્ડર નંબર")}: <b>#${o.id}</b> · ₹${o.total}<br>${x("Please press Send in WhatsApp to confirm. We will call you to confirm delivery.","કૃપા કરી વોટ્સએપમાં Send દબાવો. ડિલિવરી પાકી કરવા અમે તમને ફોન કરીશું.")}</p>
  <div class="row" style="flex-direction:column"><a class="btn" href="${waLink(o)}" target="_blank" rel="noopener">💬 ${x("Open WhatsApp again","વોટ્સએપ ફરી ખોલો")}</a><button class="btn alt" onclick="closeModal();location.hash='home'">${x("Close","બંધ કરો")}</button></div>`);
}

function showModal(h,again){$("sheet").innerHTML=h;$("modal").classList.add("on");reopen=again||(()=>{});}
function closeModal(){$("modal").classList.remove("on");if(location.hash==="#admin"&&!isAdmin)location.hash="home";}
function askPin(){
  if(isAdmin){location.hash="admin";return;}
  showModal(`<h2>${x("Enter 4-digit PIN","૪ અંકનો પિન નાખો")}</h2><input id="pin" class="pin" type="password" inputmode="numeric" maxlength="4">
  <div class="row" style="margin-top:16px"><button class="btn alt" onclick="closeModal()">${x("Close","બંધ કરો")}</button><button class="btn" onclick="checkPin()">${x("Open","ખોલો")}</button></div>`,askPin);
  setTimeout(()=>{const e=$("pin");if(e){e.focus();e.addEventListener("keydown",k=>{if(k.key==="Enter")checkPin();});}},50);
}
function checkPin(){
  if($("pin").value!==adminPin()){toast(x("Wrong PIN","પિન ખોટો છે"));$("pin").value="";return;}
  isAdmin=true;$("modal").classList.remove("on");
  if(location.hash==="#admin")route();else location.hash="admin";
}

function setStatus(id,st){const o=orders.find(v=>v.id===id);if(o){o.status=st;persist();render();}}
function prodAdminHTML(){
  return `<div class="panel"><h3>➕ ${x("Add new product","નવી પ્રોડક્ટ ઉમેરો")}</h3>
  <label>${x("Name (English)","નામ (અંગ્રેજી)")}</label><input id="n_en"><label>${x("Name (Gujarati)","નામ (ગુજરાતી)")}</label><input id="n_gu">
  <div class="row"><div><label>${x("Price (₹)","કિંમત (₹)")}</label><input id="n_pr" type="number" inputmode="numeric"></div><div><label>${x("Stock","સ્ટોક")}</label><input id="n_st" type="number" inputmode="numeric"></div></div>
  <label>${x("Ingredients (English)","સામગ્રી (અંગ્રેજી)")}</label><textarea id="n_de"></textarea><label>${x("Ingredients (Gujarati)","સામગ્રી (ગુજરાતી)")}</label><textarea id="n_dg"></textarea>
  <label>📷 ${x("Photo (upload)","ફોટો (અપલોડ)")}</label><input id="n_file" type="file" accept="image/*"><label>${x("or Photo URL","અથવા ફોટાની લિંક")}</label><input id="n_img" inputmode="url">
  <label>▶ ${x("Video link","વિડિઓ લિંક")}</label><input id="n_vid" inputmode="url"><button class="btn block" onclick="addProduct()">💾 ${x("Save","સાચવો")}</button></div><div style="height:24px"></div>`
  +products.map(p=>`<div class="panel" style="margin-bottom:18px"><h3>${esc(pname(p))}</h3>
  <div class="row"><div><label>${x("Price (₹)","કિંમત (₹)")}</label><input id="e_pr_${p.id}" type="number" inputmode="numeric" value="${p.price}"></div><div><label>${x("Stock","સ્ટોક")}</label><input id="e_st_${p.id}" type="number" inputmode="numeric" value="${p.stock}"></div></div>
  <label>▶ ${x("Video link (button shows only if filled)","વિડિઓ લિંક (ભરો તો જ બટન દેખાશે)")}</label><input id="e_vid_${p.id}" inputmode="url" value="${esc(p.video||"")}"><div class="row"><button class="btn" onclick="editProduct('${p.id}')">💾 ${x("Save","સાચવો")}</button><button class="btn red" onclick="outOfStock('${p.id}')">🚫 ${x("Out of Stock","સ્ટોક ખાલી")}</button></div>
  <button class="btn alt sm" onclick="delProduct('${p.id}')">🗑 ${x("Delete","કાઢી નાખો")}</button></div>`).join("");
}
function editProduct(id){const p=products.find(v=>v.id===id);p.price=Math.max(0,+$("e_pr_"+id).value||0);p.stock=Math.max(0,+$("e_st_"+id).value||0);p.video=$("e_vid_"+id).value.trim();if(cart[id]>p.stock){p.stock>0?cart[id]=p.stock:delete cart[id];}persist();render();toast(x("Saved","સચવાયું"));}
function outOfStock(id){products.find(v=>v.id===id).stock=0;delete cart[id];persist();render();toast(x("Saved","સચવાયું"));}
function delProduct(id){if(confirm(x("Delete this product?","આ પ્રોડક્ટ કાઢી નાખવી છે?"))){products=products.filter(v=>v.id!==id);delete cart[id];persist();render();}}
function addProduct(){
  const en=$("n_en").value.trim(),gu=$("n_gu").value.trim();if(!en&&!gu){toast(x("Enter a name","નામ લખો"));return;}
  const make=img=>{products.push({id:"p"+Date.now(),en:en||gu,gu:gu||en,price:+$("n_pr").value||0,stock:+$("n_st").value||0,descEn:$("n_de").value.trim(),descGu:$("n_dg").value.trim(),img:img||ph("🌿","#dfe9cf"),video:$("n_vid").value.trim()});persist();render();toast(x("Product added","પ્રોડક્ટ ઉમેરાઈ"));};
  const f=$("n_file").files[0];if(!f){make($("n_img").value.trim());return;}
  // Downscale uploads so they fit in LocalStorage (use Firebase Storage when hosting)
  const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,600/im.width),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);make(c.toDataURL("image/jpeg",.7));};im.src=r.result;};r.readAsDataURL(f);
}

route();
</script>
</body>
</html>
